# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: How To Scale Your Model with AMD
description: >
  A systems view of running LLMs on AMD GPUs.
keywords: scaling, amd, rocm, gpus, llms, transformers, parallelism, profiling
lang: en
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with a
  Distill-style theme adapted from <a href="https://github.com/alshedivat/al-folio">al-folio</a>.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.

# These two must match where the site is published, or every asset 404s.
url: https://clarkechong.github.io
baseurl: "/scale-your-amd"

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: false
max_width: 930px

enable_darkmode: true
enable_math: true
lazy_loading_images: true

# -----------------------------------------------------------------------------
# Open Graph
# -----------------------------------------------------------------------------

serve_og_meta: true

# -----------------------------------------------------------------------------
# Citation (rendered in the appendix of every chapter)
# -----------------------------------------------------------------------------

citation:
  key: scale-your-amd
  short: 'Chong, "How To Scale Your Model with AMD", online, 2026.'
  author: "Chong, Clarke"
  year: 2026

# -----------------------------------------------------------------------------
# Jekyll
# -----------------------------------------------------------------------------

plugins:
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  style: compressed

# `docs` and `tools` are excluded because Jekyll copies extensionless-front-matter
# files through verbatim, which was publishing the internal roadmap at
# /docs/structure.md on the live site.
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - tools
  - vendor
